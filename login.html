<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0E1116; display: grid; place-items: center; min-height: 100vh; margin: 0; color: #fff; }
  .login-box { background: #161b22; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #30363d; }
  h2 { text-align: center; margin-bottom: 30px; color: #2563eb; }
  label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
  input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; box-sizing: border-box; }
  button { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .error { color: #ef4444; font-size: 14px; text-align: center; margin-top: 15px; display: none; }
</style>
<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-box">
  <h2>Admin Login</h2>
  <form id="loginForm">
    <label>Email</label>
    <input type="email" id="email" required placeholder="ahmedarafat80593@gmail.com">
    
    <label>Password</label>
    <input type="password" id="password" required placeholder="********">
    
    <button type="submit" id="loginBtn">Login</button>
    <div class="error" id="errorMsg"></div>
  </form>
</div>

<script src="assets/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.textContent = 'Logging in...';
    errorMsg.style.display = 'none';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    // Supabase লগইন
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password,
    });

    if (error) {
      errorMsg.textContent = error.message;
      errorMsg.style.display = 'block';
      btn.textContent = 'Login';
    } else {
      // লগইন সফল হলে অ্যাডমিন পেজে পাঠিয়ে দাও
      window.location.href = 'admin.html';
    }
  });
</script>
</body>
</html>
