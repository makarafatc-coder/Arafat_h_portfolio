<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f6f7f9; margin: 0; padding: 40px 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .header h1 { margin: 0; color: #1a1d23; }
  .btn-logout { background: #ef4444; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  
  .card { background: #fff; padding: 30px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.05); margin-bottom: 30px; border: 1px solid #e5e7eb; }
  .card h3 { margin-top: 0; margin-bottom: 20px; color: #1a1d23; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 700; color: #4b5563; }
  .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
  .form-group textarea { height: 80px; resize: vertical; }
  
  .btn-save { background: #10b981; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
  .btn-add { background: #2563eb; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
  
  .project-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding: 15px 0; }
  .project-info { display: flex; align-items: center; gap: 15px; }
  .project-info img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
  .btn-delete { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Admin Dashboard</h1>
    <button class="btn-logout" id="logoutBtn">Logout</button>
  </div>

  <!-- ১. প্রোফাইল এডিট -->
  <div class="card">
    <h3>Edit Profile Information</h3>
    <form id="profileForm">
      <div class="grid-2">
        <div class="form-group"><label>Name</label><input type="text" id="pName" required></div>
        <div class="form-group"><label>Role / Title</label><input type="text" id="pRole" required></div>
      </div>
      <div class="form-group"><label>Hero Profile Photo URL</label><input type="text" id="pProfilePhoto" required placeholder="assets/images/profile/arafat-hero.png"></div>
      <div class="form-group"><label>About Section Photo URL</label><input type="text" id="pAboutPhoto" required placeholder="assets/images/profile/arafat-about.png"></div>
      <div class="form-group"><label>Short Bio</label><textarea id="pBio" required></textarea></div>
      <button type="submit" class="btn-save" id="saveProfileBtn">Update Profile</button>
    </form>
  </div>

  <!-- ২. নতুন কাজ যোগ করার ফর্ম -->
  <div class="card">
    <h3>Add New Project (Portfolio)</h3>
    <form id="addProjectForm">
      <div class="grid-2">
        <div class="form-group"><label>Project Title</label><input type="text" id="title" required></div>
        <div class="form-group"><label>Category</label><input type="text" id="category" required placeholder="Logo, Poster, etc."></div>
      </div>
      <div class="form-group"><label>Image URL</label><input type="text" id="image" required placeholder="assets/images/design/example.png"></div>
      <div class="form-group"><label>Description</label><textarea id="description" required></textarea></div>
      <button type="submit" class="btn-add" id="addBtn">Add Project</button>
    </form>
  </div>

  <!-- ৩. ডিজিটাল প্রোডাক্ট যোগ করার ফর্ম -->
  <div class="card" style="border: 2px solid #f59e0b;">
    <h3>Add Digital Product (Market)</h3>
    <form id="addProductForm">
      <div class="grid-2">
        <div class="form-group"><label>Product Name</label><input type="text" id="pTitle" required placeholder="e.g. Social Media Pack"></div>
        <div class="form-group"><label>Price (BDT)</label><input type="number" id="pPrice" required placeholder="e.g. 500"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label>Tag (e.g. PSD, Vector)</label><input type="text" id="pTag" required placeholder="PSD File"></div>
        <div class="form-group"><label>Image URL</label><input type="text" id="pImage" required placeholder="assets/images/design/example.png"></div>
      </div>
      <div class="form-group"><label>Description</label><textarea id="pDesc" required placeholder="What's included in this pack?"></textarea></div>
      <button type="submit" class="btn-save" style="background:#f59e0b;" id="addProductBtn">Add Product</button>
    </form>
  </div>

  <!-- ৪. লিস্ট দেখার জায়গা -->
  <div class="card"><h3>Your Projects</h3><div id="projectList">Loading...</div></div>
  <div class="card"><h3>Your Digital Products</h3><div id="productList">Loading...</div></div>
</div>

<script src="assets/js/supabase-client.js"></script>
<script>
  // লগইন চেক
  supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (!session) window.location.href = 'login.html';
    else { loadProfile(); loadProjects(); loadProducts(); }
  });

  // লগআউট
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut(); window.location.href = 'login.html';
  });

  // প্রোফাইল লোড
  async function loadProfile() {
    const { data } = await supabaseClient.from('profile').select('*').eq('id', 1).single();
    if (data) {
      document.getElementById('pName').value = data.name || '';
      document.getElementById('pRole').value = data.role || '';
      document.getElementById('pProfilePhoto').value = data.profile_photo || '';
      document.getElementById('pAboutPhoto').value = data.about_photo || '';
      document.getElementById('pBio').value = data.bio || '';
    }
  }

  // প্রোফাইল আপডেট
  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveProfileBtn'); btn.textContent = 'Saving...';
    const updates = { name: document.getElementById('pName').value, role: document.getElementById('pRole').value, profile_photo: document.getElementById('pProfilePhoto').value, about_photo: document.getElementById('pAboutPhoto').value, bio: document.getElementById('pBio').value };
    const { error } = await supabaseClient.from('profile').update(updates).eq('id', 1);
    alert(error ? 'Error: ' + error.message : 'Profile updated successfully!');
    btn.textContent = 'Update Profile';
  });

  // প্রজেক্ট অ্যাড
  document.getElementById('addProjectForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('addBtn'); btn.textContent = 'Saving...';
    const newProject = { title: document.getElementById('title').value, image: document.getElementById('image').value, category: document.getElementById('category').value, description: document.getElementById('description').value };
    const { error } = await supabaseClient.from('projects').insert([newProject]);
    if (error) alert('Error: ' + error.message);
    else { document.getElementById('addProjectForm').reset(); loadProjects(); }
    btn.textContent = 'Add Project';
  });

  // প্রজেক্ট লোড
  async function loadProjects() {
    const { data: projects } = await supabaseClient.from('projects').select('*').order('created_at', { ascending: false });
    const listDiv = document.getElementById('projectList');
    if (!projects || projects.length === 0) { listDiv.innerHTML = '<p>No projects found.</p>'; return; }
    listDiv.innerHTML = projects.map(p => `
      <div class="project-item">
        <div class="project-info"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/50'"><div><h4 style="margin:0">${p.title}</h4><p style="margin:0; font-size:12px; color:#666">${p.category}</p></div></div>
        <button class="btn-delete" onclick="deleteProject('${p.id}')">Delete</button>
      </div>`).join('');
  }
  window.deleteProject = async (id) => { if (confirm('Are you sure?')) { await supabaseClient.from('projects').delete().eq('id', id); loadProjects(); } };

  // প্রোডাক্ট অ্যাড
  document.getElementById('addProductForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('addProductBtn'); btn.textContent = 'Saving...';
    const newProduct = { title: document.getElementById('pTitle').value, price: parseFloat(document.getElementById('pPrice').value), image: document.getElementById('pImage').value, description: document.getElementById('pDesc').value, tag: document.getElementById('pTag').value };
    const { error } = await supabaseClient.from('products').insert([newProduct]);
    if (error) alert('Error: ' + error.message);
    else { document.getElementById('addProductForm').reset(); loadProducts(); }
    btn.textContent = 'Add Product';
  });

  // প্রোডাক্ট লোড
  async function loadProducts() {
    const { data: products } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
    const listDiv = document.getElementById('productList');
    if (!products || products.length === 0) { listDiv.innerHTML = '<p>No products found.</p>'; return; }
    listDiv.innerHTML = products.map(p => `
      <div class="project-item">
        <div class="project-info"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/50'"><div><h4 style="margin:0">${p.title}</h4><p style="margin:0; font-size:12px; color:#f59e0b; font-weight:bold;">৳ ${p.price} | ${p.tag}</p></div></div>
        <button class="btn-delete" onclick="deleteProduct('${p.id}')">Delete</button>
      </div>`).join('');
  }
  window.deleteProduct = async (id) => { if (confirm('Delete this product?')) { await supabaseClient.from('products').delete().eq('id', id); loadProducts(); } };
</script>
</body>
</html>
