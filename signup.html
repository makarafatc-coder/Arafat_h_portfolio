<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Admin Account</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0E1116; display: grid; place-items: center; min-height: 100vh; margin: 0; color: #fff; }
  .box { background: #161b22; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #30363d; }
  h2 { text-align: center; margin-bottom: 30px; color: #10b981; }
  label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
  input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; box-sizing: border-box; }
  button { width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:hover { background: #059669; }
  .msg { font-size: 14px; text-align: center; margin-top: 15px; display: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box">
  <h2>Create Admin Account</h2>
  <form id="signupForm">
    <label>Email</label>
    <input type="email" id="email" required placeholder="ahmedarafat80593@gmail.com">
    
    <label>Password</label>
    <input type="password" id="password" required placeholder="Minimum 6 characters">
    
    <button type="submit" id="signupBtn">Sign Up</button>
    <div class="msg" id="msgBox"></div>
  </form>
</div>

<script src="assets/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('signupForm');
  const btn = document.getElementById('signupBtn');
  const msgBox = document.getElementById('msgBox');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.textContent = 'Creating...';
    
    const { data, error } = await supabaseClient.auth.signUp({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    });

    if (error) {
      msgBox.textContent = error.message;
      msgBox.style.color = '#ef4444';
      msgBox.style.display = 'block';
      btn.textContent = 'Sign Up';
    } else {
      msgBox.textContent = 'Success! Redirecting to login...';
      msgBox.style.color = '#10b981';
      msgBox.style.display = 'block';
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    }
  });
</script>
</body>
</html>
